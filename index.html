<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Cıvata sıkma torku ve ön gerilme hesabı: metrik diş, mukavemet sınıfı, sürtünme katsayısı.">
<title>Cıvata Sıkma Torku · Teknik Mekanik</title>
<style>
:root{--bg:#123a63;--grid:#244a71;--panel:#0e2a4a;--row:#16426e;--line:#2c5480;--fg:#f4f8fc;--dim:#96b4d2;--yel:#f2b705;--teal:#5ae1eb;--red:#ff6040;--grn:#78dc8c;--dark:#0c2848;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px;color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px 40px}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;padding:18px 0 10px;flex-wrap:wrap}
.logo{border:3px solid var(--fg);font:700 22px/1 ui-monospace,"DejaVu Sans Mono",Menlo,monospace;padding:7px 10px}
.brand{font:700 18px ui-monospace,"DejaVu Sans Mono",Menlo,monospace;letter-spacing:.04em}
header h1{margin:0;font:700 26px/1.1 Georgia,"DejaVu Serif",serif;flex:1 1 100%}
header h1 span{color:var(--yel)}
.ig{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--yel);color:var(--dark);text-decoration:none;border-radius:12px;padding:7px 14px 7px 10px;font:600 14px/1.15 system-ui}
.ig span{display:flex;flex-direction:column}
.ig small{font-size:11.5px;font-weight:600;opacity:.8}
.ig:hover{filter:brightness(1.08)}
@media(max-width:480px){.ig{order:3;flex:1 1 100%;justify-content:center;margin-left:0}}
.lang{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{background:transparent;color:var(--dim);border:0;padding:6px 12px;font:600 13px system-ui;cursor:pointer}
.lang button.on{background:var(--yel);color:var(--dark)}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.col{display:contents!important}.dimcard{order:2}.steps{order:3}}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h2{margin:0 0 12px;font:700 13px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.types button{background:var(--row);border:2px solid transparent;border-radius:12px;color:var(--fg);padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 12.5px system-ui}
.types button svg{width:44px;height:34px}
.types button.on{border-color:var(--yel);color:var(--yel)}
.fig{display:flex;justify-content:center;margin:4px 0 12px}
.fig svg{width:100%;max-width:340px;height:auto}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--dim)}
input,select{background:var(--dark);border:2px solid var(--line);border-radius:10px;color:var(--fg);font:600 16px ui-monospace,"DejaVu Sans Mono",Menlo,monospace;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--teal)}
.chk{flex-direction:row;align-items:center;gap:8px;margin-top:10px;color:var(--fg)}
.chk input{width:auto}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.res div{background:var(--row);border-radius:12px;padding:10px 12px}
.res small{display:block;color:var(--dim);font-size:12px}
.res b{font:700 20px ui-monospace,"DejaVu Sans Mono",Menlo,monospace;color:var(--teal);font-variant-numeric:tabular-nums}
.res .tot{background:var(--yel);color:var(--dark)}
.res .tot small{color:var(--dark)}
.res .tot b{color:var(--dark);font-size:24px}
@media(max-width:480px){.res{grid-template-columns:1fr 1fr}.res .tot{grid-column:1/-1}}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{background:var(--yel);color:var(--dark);border:0;border-radius:12px;padding:11px 16px;font:700 15px system-ui;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn.teal{background:var(--teal)}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.dimcard{align-self:start}
.steps ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.steps li{background:var(--row);border-left:4px solid var(--yel);border-radius:10px;padding:9px 12px}
.steps li .k{display:block;color:var(--dim);font-size:12px}
.steps li code{font:600 15px ui-monospace,"DejaVu Sans Mono",Menlo,monospace;color:var(--fg);white-space:normal;word-break:break-word}
.steps li code em{color:var(--yel);font-style:normal}
.note{color:var(--dim);font-size:12.5px;margin-top:10px}
.list{margin-top:16px}
.tbl{overflow-x:auto;border-radius:12px;border:2px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th.n{text-align:right}
th{background:var(--yel);color:var(--dark);text-align:left;padding:9px 10px;font-weight:700;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:nth-child(odd){background:var(--row)}
td.n{text-align:right;font-family:ui-monospace,"DejaVu Sans Mono",Menlo,monospace}
tfoot td{background:var(--dark);font-weight:700;color:var(--yel)}
.del{background:transparent;border:0;color:var(--red);font-size:18px;cursor:pointer}
.empty{color:var(--dim);padding:18px;text-align:center}
.proj{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px}
footer{color:var(--dim);font-size:12.5px;margin-top:22px;text-align:center}

.sel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.presets button{background:var(--row);border:2px solid transparent;border-radius:12px;color:var(--fg);padding:8px 10px;cursor:pointer;text-align:left;font:600 13px system-ui}
.presets button b{display:block;font:700 17px ui-monospace,"DejaVu Sans Mono",Menlo,monospace;color:var(--yel)}
.presets button small{color:var(--dim);font-size:11.5px}
.presets button.on{border-color:var(--yel)}
.res4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.res4 div{background:var(--row);border-radius:12px;padding:10px 12px}
.res4 small{display:block;color:var(--dim);font-size:12px}
.res4 b{font:700 18px ui-monospace,"DejaVu Sans Mono",Menlo,monospace;color:var(--teal);font-variant-numeric:tabular-nums}
.res4 .ty{grid-column:1/-1;background:var(--yel);color:var(--dark)}
.res4 .ty small{color:var(--dark)}
.res4 .ty b{color:var(--dark);font-size:22px}
.use{margin-top:10px;color:var(--fg);background:var(--row);border-left:4px solid var(--teal);border-radius:10px;padding:9px 12px;font-size:13.5px}
.zone svg{width:100%;height:auto;display:block}

.mu{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mu button{flex:1 1 92px;background:var(--row);border:2px solid transparent;border-radius:12px;color:var(--fg);padding:8px 10px;cursor:pointer;text-align:left;font:600 12.5px system-ui}
.mu button b{display:block;font:700 16px ui-monospace,"DejaVu Sans Mono",Menlo,monospace;color:var(--teal)}
.mu button.on{border-color:var(--teal)}
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.big div{border-radius:14px;padding:12px 14px}
.big .t{background:var(--yel);color:var(--dark)}
.big .f{background:var(--teal);color:var(--dark)}
.big small{display:block;font-size:12.5px;font-weight:600}
.big b{font:800 30px ui-monospace,"DejaVu Sans Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.big i{font-style:normal;font-size:15px;font-weight:700;margin-left:4px}
.warn{margin-top:10px;background:var(--row);border-left:4px solid var(--red);border-radius:10px;padding:9px 12px;font-size:13.5px}
.chart svg{width:100%;height:auto;display:block}
@media(max-width:860px){.dimcard{order:1!important}.chart{order:2}.steps{order:3}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo">TM</div><div class="brand" id="brand">TEKNİK MEKANİK</div>
<a class="ig" href="https://www.instagram.com/teknik.mekaniktm/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.6" cy="6.4" r="1.3" fill="currentColor"/></svg><span><b>@teknik.mekaniktm</b><small id="igt"></small></span></a>
<div class="lang"><button data-l="tr" class="on">TR</button><button data-l="en">EN</button></div>
<h1 id="ttl"></h1>
</header>
<div class="grid">
<section class="card dimcard">
<h2 id="h_in"></h2>
<div class="sel">
<label><span id="l_th"></span><select id="th"></select></label>
<label><span id="l_cl"></span><select id="cl"></select></label>
<label><span id="l_mu"></span><input id="mu" inputmode="decimal" value="0,12"></label>
<label><span id="l_nu"></span><select id="nu"><option value="0.9">90</option><option value="0.8">80</option><option value="0.7">70</option></select></label>
</div>
<div class="mu" id="mus"></div>
<div class="big">
<div class="t"><small id="r1l"></small><b id="r1">–</b><i>N·m</i></div>
<div class="f"><small id="r2l"></small><b id="r2">–</b><i>kN</i></div>
</div>
<div class="res4">
<div><small id="r3l"></small><b id="r3">–</b></div>
<div><small id="r4l"></small><b id="r4">–</b></div>
</div>
<div class="warn" id="warn"></div>
<div class="btns"><button class="btn" id="add"></button></div>
</section>
<div class="col">
<section class="card chart">
<h2 id="h_ch"></h2>
<div id="chart"></div>
<div class="note" id="chnote"></div>
</section>
<section class="card steps">
<h2 id="h_steps"></h2>
<ol id="steps"></ol>
<div class="note" id="stepnote"></div>
</section>
</div>
</div>
<section class="card list">
<h2 id="h_list"></h2>
<div class="proj">
<label><span id="l_proj"></span><input id="proj"></label>
<label><span id="l_by"></span><input id="by"></label>
</div>
<div class="tbl"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="btns"><button class="btn teal" id="pdf"></button><button class="btn ghost" id="clr"></button></div>
<div class="note" id="tolnote"></div>
</section>
<footer id="foot"></footer>
</div>
<script>
const $=id=>document.getElementById(id);
const TH=[['M3',3,0.5,4.6,3.4],['M4',4,0.7,5.9,4.5],['M5',5,0.8,6.9,5.5],['M6',6,1,8.9,6.6],['M8',8,1.25,11.6,9],['M10',10,1.5,14.6,11],['M12',12,1.75,16.6,13.5],['M14',14,2,19.6,15.5],['M16',16,2,22.5,17.5],['M18',18,2.5,25.3,20],['M20',20,2.5,28.2,22],['M22',22,2.5,31.7,24],['M24',24,3,33.6,26],['M27',27,3,38,30],['M30',30,3.5,42.8,33],['M33',33,3.5,46.6,36],['M36',36,4,51.1,39],
['M8×1',8,1,11.6,9],['M10×1,25',10,1.25,14.6,11],['M12×1,5',12,1.5,16.6,13.5],['M16×1,5',16,1.5,22.5,17.5],['M20×1,5',20,1.5,28.2,22],['M24×2',24,2,33.6,26]];
const CL=[['4.6',240,240],['5.6',300,300],['8.8',640,660],['10.9',940,940],['12.9',1100,1100],['A2-70',450,450],['A4-80',600,600]];
const MU=[[0.08,{tr:'MoS₂ macun',en:'MoS₂ paste'}],[0.10,{tr:'Yağ + macun',en:'Oil + paste'}],[0.12,{tr:'Hafif yağlı',en:'Lightly oiled'}],[0.14,{tr:'Kuru çelik',en:'Dry steel'}],[0.18,{tr:'Kuru çinko / paslanmaz',en:'Dry zinc / stainless'}]];
const T={tr:{ttl:'Cıvata <span>Sıkma Torku</span>',igt:'Daha fazlası için takip et',inp:'Cıvata ve sürtünme',th:'Diş',cl:'Mukavemet sınıfı',mu:'Sürtünme katsayısı μ',nu:'Akma sınırı kullanımı',r1:'Sıkma torku M_A',r2:'Ön gerilme F_M',r3:'Gerilme kesiti A_s',r4:'Akma sınırı R_p0,2',add:'+ Listeye ekle',ch:'Aynı tork, farklı sürtünme',chn:'Tork anahtarı torku ölçer, ön gerilmeyi değil. Sürtünme değişirse cıvatadaki kuvvet de değişir.',steps:'Adım adım hesap',stn:'VDI 2230 yaklaşımı · μ_G = μ_K = μ · d_W ISO 4017, d_h orta delik (ISO 273)',
list:'Cıvata listesi',proj:'Proje / makine',by:'Hazırlayan',pdf:'PDF indir',clr:'Listeyi temizle',empty:'Henüz cıvata eklenmedi.',cols:['#','Diş','Sınıf','μ','Kullanım','A_s (mm²)','F_M (kN)','M_A (N·m)',''],
note:'Ön hesaptır. Kritik bağlantılarda VDI 2230 hesabı ve üretici değerleri esas alınır. Sürtünme katsayıları tipiktir.',foot:'Teknik Mekanik · @teknik.mekaniktm',pdfT:'CIVATA SIKMA LİSTESİ',page:'Sayfa',date:'Tarih',bad:'Sürtünme katsayısı 0,04 ile 0,30 arasında olmalı.',
w1:(lo,hi,p)=>`Aynı torkla μ = ${p.lo} olursa ön gerilme <b>${lo} kN</b>, μ = ${p.hi} olursa <b>${hi} kN</b> olur.`,s:{geo:'Diş geometrisi',as:'Gerilme kesiti',fm:'İzin verilen ön gerilme',dk:'Baş altı sürtünme çapı',ma:'Sıkma torku',key:'Tork anahtarı ayarı'},muL:'μ (sürtünme)',fL:'F_M (kN)'},
en:{ttl:'Bolt <span>Tightening Torque</span>',igt:'Follow for more',inp:'Bolt and friction',th:'Thread',cl:'Property class',mu:'Friction coefficient μ',nu:'Yield utilisation',r1:'Tightening torque M_A',r2:'Preload F_M',r3:'Stress area A_s',r4:'Yield strength R_p0.2',add:'+ Add to list',ch:'Same torque, different friction',chn:'A torque wrench measures torque, not preload. If friction changes, the bolt force changes too.',steps:'Step-by-step',stn:'VDI 2230 approach · μ_G = μ_K = μ · d_W ISO 4017, d_h medium hole (ISO 273)',
list:'Bolt list',proj:'Project / machine',by:'Prepared by',pdf:'Download PDF',clr:'Clear list',empty:'No bolts added yet.',cols:['#','Thread','Class','μ','Utilis.','A_s (mm²)','F_M (kN)','M_A (N·m)',''],
note:'Preliminary calculation. For critical joints use a full VDI 2230 check and manufacturer data. Friction values are typical.',foot:'Technical Mechanics · @teknik.mekaniktm',pdfT:'BOLT TIGHTENING LIST',page:'Page',date:'Date',bad:'Friction coefficient must be between 0.04 and 0.30.',
w1:(lo,hi,p)=>`With the same torque, μ = ${p.lo} gives <b>${lo} kN</b> preload, μ = ${p.hi} gives <b>${hi} kN</b>.`,s:{geo:'Thread geometry',as:'Stress area',fm:'Permissible preload',dk:'Head friction diameter',ma:'Tightening torque',key:'Torque wrench setting'},muL:'μ (friction)',fL:'F_M (kN)'}};
let L='tr',list=[];
try{const s=JSON.parse(localStorage.getItem('tm_civata')||'null');if(s){L=s.L||'tr';list=s.list||[]}}catch(e){}
function save(){try{localStorage.setItem('tm_civata',JSON.stringify({L,list}))}catch(e){}}
const pn=v=>parseFloat(String(v).replace(',','.'));
const pc=v=>L==='tr'?'%'+Math.round(v*100):Math.round(v*100)+'%';const nf=(v,d=1)=>v.toLocaleString(L==='tr'?'tr-TR':'en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
function geo(t){const[,d,P,dw,dh]=t,d2=d-0.649519*P,d3=d-1.226869*P,d0=(d2+d3)/2,As=Math.PI/4*d0*d0;return{d,P,dw,dh,d2,d3,d0,As,Dk:(dw+dh)/2}}
function fm(g,Rp,mu,nu){return nu*Rp*g.As/Math.sqrt(1+3*Math.pow(1.5*g.d2/g.d0*(g.P/(Math.PI*g.d2)+1.155*mu),2))}
function kfac(g,mu){return 0.16*g.P+0.58*g.d2*mu+g.Dk/2*mu}
function compute(){const ti=+$('th').value,ci=+$('cl').value,mu=pn($('mu').value),nu=+$('nu').value;if(!(mu>=0.04&&mu<=0.3))return null;
const t=TH[ti],c=CL[ci],g=geo(t),Rp=g.d>16?c[2]:c[1],F=fm(g,Rp,mu,nu),M=F*kfac(g,mu)/1000;return{ti,ci,t,c,g,Rp,mu,nu,F,M}}
function chart(r){const k=T[L];if(!r){$('chart').innerHTML='';return}
const W=380,H=230,x0=46,x1=W-14,y0=30,y1=H-34,mus=[];for(let m=0.06;m<=0.2001;m+=0.005)mus.push(m);
const Fv=mus.map(m=>r.M*1000/kfac(r.g,m)/1000),Fy=r.F/1000,fmax=Math.max(...Fv)*1.08,Rlim=r.Rp*r.g.As/1000;
const X=m=>x0+(x1-x0)*(m-0.06)/0.14,Y=f=>y1-(y1-y0)*f/Math.max(fmax,Rlim*1.05);
let s=`<svg viewBox="0 0 ${W} ${H}"><rect x="${x0}" y="${Y(Rlim*1.05)}" width="${x1-x0}" height="${Y(Rlim)-Y(Rlim*1.05)}" fill="#ff6040" fill-opacity=".25"/>`;
s+=`<line x1="${x0}" x2="${x1}" y1="${Y(Rlim)}" y2="${Y(Rlim)}" stroke="#ff6040" stroke-dasharray="5 4" stroke-width="2"/><text x="${x1}" y="${Y(Rlim)-5}" fill="#ff6040" font-size="11" text-anchor="end">R_p0,2 · A_s</text>`;
s+=`<line x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}" stroke="#96b4d2"/><line x1="${x0}" x2="${x0}" y1="${y0}" y2="${y1}" stroke="#96b4d2"/>`;
[0.08,0.12,0.16,0.20].forEach(m=>{s+=`<text x="${X(m)}" y="${y1+16}" fill="#96b4d2" font-size="11" text-anchor="middle">${nf(m,2)}</text>`});
s+=`<text x="${x1}" y="${y1+30}" fill="#96b4d2" font-size="11" text-anchor="end">${k.muL}</text><text x="${x0}" y="${y0-14}" fill="#96b4d2" font-size="11" text-anchor="start">${k.fL}</text>`;
s+=`<polyline fill="none" stroke="#f2b705" stroke-width="3" points="${mus.map((m,i)=>X(m)+','+Y(Fv[i])).join(' ')}"/>`;
s+=`<circle cx="${X(r.mu)}" cy="${Y(Fy)}" r="6" fill="#5ae1eb" stroke="#0c2848" stroke-width="2"/><text x="${X(r.mu)+9}" y="${Y(Fy)-8}" fill="#5ae1eb" font-size="12" font-weight="700">${nf(Fy)} kN</text>`;
[0.06,0.20].forEach(m=>{const f=r.M/kfac(r.g,m);s+=`<text x="${X(m)+(m<0.1?4:-4)}" y="${Y(f)+(m<0.1?-8:14)}" fill="#f4f8fc" font-size="11" text-anchor="${m<0.1?'start':'end'}">${nf(f)} kN</text>`});
s+='</svg>';$('chart').innerHTML=s}
function upd(){const k=T[L],r=compute();chart(r);
if(!r){['r1','r2','r3','r4'].forEach(i=>$(i).textContent='–');$('steps').innerHTML=`<li>${k.bad}</li>`;$('warn').innerHTML='';return}
const g=r.g;$('r1').textContent=nf(r.M);$('r2').textContent=nf(r.F/1000);$('r3').textContent=nf(g.As)+' mm²';$('r4').textContent=r.Rp+' MPa';
const lo=Math.max(0.04,r.mu-0.04),hi=r.mu+0.04,flo=r.M/kfac(g,lo),fhi=r.M/kfac(g,hi);
$('warn').innerHTML=k.w1(nf(flo),nf(fhi),{lo:nf(lo,2),hi:nf(hi,2)});
document.querySelectorAll('#nu option').forEach(o=>o.textContent=pc(+o.value));const st=k.s,steps=[[st.geo,`d = ${g.d} · P = ${nf(g.P,2)} · d₂ = d − 0,6495·P = <em>${nf(g.d2,3)}</em> · d₃ = d − 1,2269·P = <em>${nf(g.d3,3)}</em> mm`],
[st.as,`A_s = π/4 · ((d₂ + d₃)/2)² = <em>${nf(g.As)}</em> mm²`],
[st.fm,`F_M = ν·R_p·A_s / √(1 + 3·[1,5·d₂/d₀·(P/(π·d₂) + 1,155·μ)]²) = <em>${nf(r.F/1000,2)}</em> kN`],
[st.dk,`D_Km = (d_W + d_h)/2 = (${nf(g.dw)} + ${nf(g.dh)})/2 = <em>${nf(g.Dk,2)}</em> mm`],[st.ma,`M_A = F_M · (0,16·P + 0,58·d₂·μ + D_Km/2·μ) = <em>${nf(r.M,1)}</em> N·m`],
[st.key,`≈ <em>${Math.round(r.M)}</em> N·m`]];
$('steps').innerHTML=steps.map(([x,y])=>`<li><span class="k">${x}</span><code>${y}</code></li>`).join('');
document.querySelectorAll('#mus button').forEach(b=>b.classList.toggle('on',Math.abs(+b.dataset.m-r.mu)<1e-6))}
function mus(){$('mus').innerHTML=MU.map(([m,n])=>`<button data-m="${m}"><b>μ = ${nf(m,2)}</b>${n[L]}</button>`).join('');
document.querySelectorAll('#mus button').forEach(b=>b.onclick=()=>{$('mu').value=nf(+b.dataset.m,2);upd()})}
function table(){const k=T[L];$('thead').innerHTML=k.cols.map((c,i)=>`<th class="${i>=5&&i<=7?'n':''}">${c}</th>`).join('');
$('tbody').innerHTML=list.length?list.map((r,i)=>`<tr><td>${i+1}</td><td><b>${r.n}</b></td><td>${r.c}</td><td>${nf(r.mu,2)}</td><td>${pc(r.nu)}</td><td class="n">${nf(r.As)}</td><td class="n">${nf(r.F/1000)}</td><td class="n"><b>${nf(r.M)}</b></td><td><button class="del" data-i="${i}">✕</button></td></tr>`).join(''):`<tr><td colspan="9" class="empty">${k.empty}</td></tr>`;
document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.i,1);save();table()})}
function texts(){const k=T[L];document.documentElement.lang=L;$('ttl').innerHTML=k.ttl;$('brand').textContent=L==='tr'?'TEKNİK MEKANİK':'TECHNICAL MECHANICS';$('igt').textContent=k.igt;
$('h_in').textContent=k.inp;$('l_th').textContent=k.th;$('l_cl').textContent=k.cl;$('l_mu').textContent=k.mu;$('l_nu').textContent=k.nu;
['r1','r2','r3','r4'].forEach(i=>$(i+'l').textContent=k[i]);$('add').textContent=k.add;$('h_ch').textContent=k.ch;$('chnote').textContent=k.chn;$('h_steps').textContent=k.steps;$('stepnote').textContent=k.stn;
$('h_list').textContent=k.list;$('l_proj').textContent=k.proj;$('l_by').textContent=k.by;$('pdf').textContent=k.pdf;$('clr').textContent=k.clr;$('tolnote').textContent=k.note;$('foot').textContent=k.foot;
const m=pn($('mu').value);if(m>0)$('mu').value=nf(m,2);
document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L))}
function fill(){$('th').innerHTML=TH.map((t,i)=>`<option value="${i}">${t[0]}</option>`).join('');$('cl').innerHTML=CL.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('');$('th').value=4;$('cl').value=2}
function all(){texts();mus();upd();table()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;save();all()});
['th','cl','mu','nu'].forEach(id=>{$(id).addEventListener('input',upd);$(id).addEventListener('change',upd)});
$('add').onclick=()=>{const r=compute();if(!r)return;list.push({n:r.t[0],c:r.c[0],mu:r.mu,nu:r.nu,As:r.g.As,F:r.F,M:r.M,d2:r.g.d2,P:r.g.P,Rp:r.Rp});save();table()};
$('clr').onclick=()=>{list=[];save();table()};
$('pdf').onclick=()=>makePdf();
function makePdf(){if(!list.length)return;const k=T[L],Wp=1240,Hp=1754,M=80,pages=[];let c,x,y;
const np=()=>{c=document.createElement('canvas');c.width=Wp;c.height=Hp;x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,Wp,Hp);x.textBaseline='middle';
x.fillStyle='#123a63';x.fillRect(0,0,Wp,120);x.strokeStyle='#fff';x.lineWidth=4;x.strokeRect(M,32,76,56);x.fillStyle='#fff';x.font='bold 32px monospace';x.textAlign='center';x.fillText('TM',M+38,61);
x.textAlign='left';x.font='bold 26px monospace';x.fillText(L==='tr'?'TEKNİK MEKANİK':'TECHNICAL MECHANICS',M+100,61);x.fillStyle='#f2b705';x.font='bold 30px sans-serif';x.textAlign='right';x.fillText(k.pdfT,Wp-M,61);
x.textAlign='left';pages.push(c);y=170};
const foot=(i,n)=>{const g=pages[i].getContext('2d');g.fillStyle='#6a7896';g.font='20px sans-serif';g.textAlign='left';g.fillText(k.note,M,Hp-60,Wp-2*M);g.textAlign='right';g.fillText(`${k.page} ${i+1}/${n}`,Wp-M,Hp-30);g.textAlign='left';g.fillText(k.foot,M,Hp-30)};
np();x.fillStyle='#123a63';x.font='bold 28px sans-serif';const pj=$('proj').value||'—',by=$('by').value||'—';
x.fillText(`${k.proj}: ${pj}`,M,y);x.textAlign='right';x.fillText(`${k.date}: ${new Date().toLocaleDateString(L==='tr'?'tr-TR':'en-GB')}`,Wp-M,y);x.textAlign='left';y+=42;x.font='24px sans-serif';x.fillStyle='#444';x.fillText(`${k.by}: ${by}`,M,y);y+=50;
const cw=[50,150,110,90,130,170,170,170],cols=k.cols.slice(0,8),al=[0,0,0,1,0,1,1,1];
const head=()=>{x.fillStyle='#f2b705';x.fillRect(M,y-24,Wp-2*M,48);x.fillStyle='#0c2848';x.font='bold 20px sans-serif';let cx=M+8;cols.forEach((h,i)=>{x.textAlign=al[i]?'right':'left';x.fillText(h,al[i]?cx+cw[i]-12:cx,y);cx+=cw[i]});x.textAlign='left';y+=48};
head();
list.forEach((r,i)=>{if(y>Hp-220){np();head()}if(i%2===0){x.fillStyle='#eef3f9';x.fillRect(M,y-22,Wp-2*M,44)}
const cells=[String(i+1),r.n,r.c,nf(r.mu,2),pc(r.nu),nf(r.As),nf(r.F/1000),nf(r.M)];
x.fillStyle='#111';x.font='22px sans-serif';let cx=M+8;cells.forEach((v,j)=>{x.textAlign=al[j]?'right':'left';x.font=j===7?'bold 22px sans-serif':'22px sans-serif';x.fillText(v,al[j]?cx+cw[j]-12:cx,y,cw[j]-14);cx+=cw[j]});x.textAlign='left';y+=44});
pages.forEach((_,i)=>foot(i,pages.length));
const enc=new TextEncoder(),parts=[],offs=[];let len=0;const push=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
const imgs=pages.map(p=>{const d=atob(p.toDataURL('image/jpeg',0.9).split(',')[1]);const u=new Uint8Array(d.length);for(let i=0;i<d.length;i++)u[i]=d.charCodeAt(i);return u});
const n=pages.length,obj=(id,body)=>{offs[id]=len;push(`${id} 0 obj\n`);body();push('\nendobj\n')};
push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
obj(2,()=>push(`<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] >>`));
pages.forEach((_,i)=>{const p=3+i*3,im=p+1,cs=p+2,cnt=`q 595.28 0 0 841.89 0 0 cm /I${i} Do Q`;
obj(p,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /I${i} ${im} 0 R >> >> /Contents ${cs} 0 R >>`));
obj(im,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${Wp} /Height ${Hp} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgs[i].length} >>\nstream\n`);push(imgs[i]);push('\nendstream')});
obj(cs,()=>push(`<< /Length ${cnt.length} >>\nstream\n${cnt}\nendstream`))});
const xo=len,tot=3+n*3;let xr=`xref\n0 ${tot}\n0000000000 65535 f \n`;for(let i=1;i<tot;i++)xr+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
push(xr+`trailer\n<< /Size ${tot} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF`);
const blob=new Blob(parts,{type:'application/pdf'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);
a.download=(($('proj').value||(L==='tr'?'civata_listesi':'bolt_list')).replace(/[^\wçğıöşüÇĞİÖŞÜ-]+/g,'_'))+'.pdf';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
fill();all();
</script>
